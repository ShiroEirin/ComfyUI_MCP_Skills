name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src/comfyui_mcp_skills
      - run: uv run mypy src/comfyui_mcp_skills
      - run: uv run python -m pytest --cov --cov-report=term-missing -q
      - run: uv run python -m compileall -q src/comfyui_mcp_skills comfyui_skills_cli
      - run: uv run pip-audit
      - name: Verify tag matches package version
        run: >-
          uv run python -c "import os, comfyui_mcp_skills as p;
          expected = 'v' + p.__version__; actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'tag {actual!r} does not match {expected!r}'"
      - run: uv build
      - name: Verify built wheel
        run: |
          uv venv "${RUNNER_TEMP}/wheel-venv"
          uv pip install --python "${RUNNER_TEMP}/wheel-venv/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          ./wheel-venv/bin/python -c "import comfyui_mcp_skills; print(comfyui_mcp_skills.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

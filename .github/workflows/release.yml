name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra otel
      - run: uv run ruff check src/comfyui_mcp_skills
      - run: uv run mypy src/comfyui_mcp_skills
      - run: uv run python -m pytest --cov --cov-report=term-missing -q
      - run: uv run python -m compileall -q src/comfyui_mcp_skills comfyui_skills_cli
      - run: uv run pip-audit
      - name: Verify tag matches package version
        run: >-
          uv run python -c "import os, comfyui_mcp_skills as p;
          expected = 'v' + p.__version__; actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'tag {actual!r} does not match {expected!r}'"
      - run: uv build
      - name: Verify built wheel
        run: |
          uv venv "${RUNNER_TEMP}/wheel-venv"
          uv pip install --python "${RUNNER_TEMP}/wheel-venv/bin/python" dist/*.whl
          cd "${RUNNER_TEMP}"
          ./wheel-venv/bin/python -c "import comfyui_mcp_skills; print(comfyui_mcp_skills.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ComfyUI MCP Skills $TAG" \
            --generate-notes

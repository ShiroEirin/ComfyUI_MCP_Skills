[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mcp-skills"
dynamic = ["version"]
description = "Agent-native ComfyUI workflow execution over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "HuangYuChuh" },
]
keywords = ["comfyui", "mcp", "agent", "workflow", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2,<3",
    "mcp-types>=2,<3",
    "jsonschema>=4.23,<5",
    "requests>=2.28",
    "certifi>=2024.2",
    "filelock>=3.15",
    "urllib3>=2",
    "rich>=13",
    "typer>=0.9",
    "websocket-client>=1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]

dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.9,<1",
]

otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.scripts]
comfyui-skill = "comfyui_skills_cli.__main__:main"
comfyui-mcp = "comfyui_mcp_skills.__main__:main"
comfyui-mcp-http = "comfyui_mcp_skills.http_main:main"
comfyui-mcp-admin = "comfyui_mcp_skills.admin_main:main"
comfyui-mcp-maintain = "comfyui_mcp_skills.maintenance_main:main"
comfyui-mcp-migration-dry-run = "comfyui_mcp_skills.migration_main:main"
comfyui-mcp-migrate = "comfyui_mcp_skills.cutover_main:main"
comfyui-mcp-eval = "comfyui_mcp_skills.eval_main:main"
comfyui-mcp-eval-deepseek = "comfyui_mcp_skills.deepseek_eval_main:main"

[project.urls]
Repository = "https://github.com/ShiroEirin/ComfyUI_MCP_Skills"
Issues = "https://github.com/ShiroEirin/ComfyUI_MCP_Skills/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["comfyui_mcp_skills*", "comfyui_skills_cli*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "comfyui_mcp_skills.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["comfyui_mcp_skills"]
omit = [
    "*/__main__.py",
    "*/admin_main.py",
    "*/http_main.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
